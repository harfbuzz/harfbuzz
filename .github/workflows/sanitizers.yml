name: sanitizers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    env:
      CC: ccache clang
      CXX: ccache clang++
      ASAN_OPTIONS: log_path=stderr:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: log_path=stderr:halt_on_error=1:abort_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: log_path=stderr:halt_on_error=1:abort_on_error=1
      MSAN_OPTIONS: log_path=stderr:halt_on_error=1:abort_on_error=1:print_stacktrace=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            SANITIZE: address,undefined
          - name: tsan
            SANITIZE: thread
          - name: msan
            SANITIZE: memory
            MESON_ARGS: >-
              -Dglib=disabled
              -Dgobject=disabled
              -Dcairo=disabled
              -Dfreetype=disabled
              -Dicu=disabled
              -Dzlib=disabled
              -Dpng=disabled

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Ccache
      id: compiler-cache
      uses: ./.github/actions/compiler-cache
      with:
        key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}
    - name: Install Dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install -y \
          clang \
          lld \
          binutils \
          pkg-config \
          libfreetype6-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libicu-dev \
          libgraphite2-dev
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Install Python Dependencies
      run: pip3 install -r .ci/requirements.txt --require-hashes
    - name: Setup Meson
      run: |
        ccache --version
        meson setup build \
          --default-library=static \
          --buildtype=debugoptimized \
          --wrap-mode=nodownload \
          -Db_sanitize=${{ matrix.SANITIZE }} \
          -Dexperimental_api=true \
          ${{ matrix.MESON_ARGS }}
    - name: Build
      run: meson compile -Cbuild
    - name: Test
      run: meson test -Cbuild -t 10 --print-errorlogs
    - name: Save Compiler Cache
      if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
      uses: ./.github/actions/save-compiler-cache
      with:
        key: ${{ steps.compiler-cache.outputs.key }}
        variant: ${{ steps.compiler-cache.outputs.variant }}
        start: ${{ steps.compiler-cache.outputs.start }}
