name: CoreText kerx stack probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build native probe
      run: |
        clang -std=c11 -Wall -Wextra -Werror .ci/kerx-stack-probe.c \
          -framework CoreFoundation -framework CoreGraphics -framework CoreText \
          -o "$RUNNER_TEMP/kerx-stack-probe"
    - name: Probe stack semantics
      run: |
        sw_vers
        python3 - "$RUNNER_TEMP/kerx-stack-probe" <<'PY'
        import json, subprocess, sys
        with open('.ci/kerx-stack-results.json') as source:
            reference = {case['case']: case['glyphs'] for case in json.load(source)['cases']}
        for case in json.load(open('.ci/kerx-stack-probes.json')):
            raw = subprocess.check_output([sys.argv[1], case['font'], case['text']], text=True)
            glyphs = json.loads(raw)
            print(json.dumps({'case': case['name'], 'glyphs': glyphs}), flush=True)
            expected = reference[case['name']]
            positions = lambda items: [(g['gid'], g['cluster'], g['x'], g['y']) for g in items]
            assert positions(glyphs) == positions(expected), case['name']
            extent = lambda items: items[-1]['x'] + items[-1]['advance']
            assert extent(glyphs) == extent(expected), case['name']
        PY
