name: CoreText kerx stack probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build native probe
      run: |
        clang -std=c11 -Wall -Wextra -Werror .ci/kerx-stack-probe.c \
          -framework CoreFoundation -framework CoreGraphics -framework CoreText \
          -o "$RUNNER_TEMP/kerx-stack-probe"
    - name: Probe stack semantics
      run: |
        sw_vers
        python3 - "$RUNNER_TEMP/kerx-stack-probe" <<'PY'
        import json, subprocess, sys
        for case in json.load(open('.ci/kerx-stack-probes.json')):
            raw = subprocess.check_output([sys.argv[1], case['font'], case['text']], text=True)
            print(json.dumps({'case': case['name'], 'glyphs': json.loads(raw)}), flush=True)
        PY
