name: c++ versions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install -y g++ clang
    - name: Build
      run: |
        status=0
        for cxx in g++ clang++; do
          for standard in c++11 c++2c; do
            echo "::group::$cxx $standard"
            "$cxx" -c src/harfbuzz-world.cc -DHB_NO_MT -Werror -std="$standard" || status=1
            echo "::endgroup::"
          done
        done
        exit "$status"
