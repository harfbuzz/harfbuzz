name: macos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Ccache
      id: compiler-cache
      uses: ./.github/actions/compiler-cache
      with:
        key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
    - name: Install Dependencies
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        export HOMEBREW_NO_INSTALL_CLEANUP=1
        brew rm -f pkg-config@0.29.2
        brew install \
          cairo \
          chafa \
          freetype \
          glib \
          gobject-introspection \
          glew \
          glfw \
          graphite2 \
          icu4c \
          libpng \
          meson \
          ninja \
          pkgconf
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Install Python Dependencies
      run: pip3 install -r .ci/requirements.txt --require-hashes
    - name: Setup Meson
      env:
        PKG_CONFIG_PATH: "/usr/local/opt/libffi/lib/pkgconfig"
      run: |
        brew link --force icu4c
        ccache --version
        meson setup build \
          -Dauto_features=enabled \
          -Ddocs=disabled \
          -Dcoretext=enabled \
          -Dgraphite=enabled \
          -Doptimization=2 \
    - name: Build
      run: meson compile -Cbuild
    - name: Test
      run: meson test --print-errorlogs -Cbuild
    - name: Save Compiler Cache
      if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
      uses: ./.github/actions/save-compiler-cache
      with:
        key: ${{ steps.compiler-cache.outputs.key }}
        variant: ${{ steps.compiler-cache.outputs.variant }}
        start: ${{ steps.compiler-cache.outputs.start }}
