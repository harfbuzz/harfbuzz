name: crossbuild-mingw

on:
  push:
    branches: [ main ]
    tags: ["*.*.*"]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32
            ARCH: 32
            TRIPLET: i686-w64-mingw32
            PACKAGES: g++-mingw-w64-i686 wine wine32
          - name: win64
            ARCH: 64
            TRIPLET: x86_64-w64-mingw32
            PACKAGES: g++-mingw-w64-x86-64 wine wine64 wine32:i386

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Ccache
      id: compiler-cache
      uses: ./.github/actions/compiler-cache
      with:
        key: ${{ github.workflow }}-${{ runner.os }}-${{ matrix.ARCH }}
    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install -y \
          zip \
          ${{ matrix.PACKAGES }}
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Install Python Dependencies
      run: pip3 install -r .ci/requirements.txt --require-hashes
    - name: Build
      run: |
        cat > "$RUNNER_TEMP/ccache-cross-file.txt" <<'EOF'
        [binaries]
        c = ['ccache', '${{ matrix.TRIPLET }}-gcc']
        cpp = ['ccache', '${{ matrix.TRIPLET }}-g++']
        EOF
        bash .ci/build-win.sh ${{ matrix.ARCH }} \
          --cross-file="$RUNNER_TEMP/ccache-cross-file.txt"
    - name: Test
      run: meson devenv -Cbuild-win${{ matrix.ARCH }} meson test -t 10 --print-errorlogs --suite=harfbuzz
    - name: Archive artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: harfbuzz-win${{ matrix.ARCH }}
        path: harfbuzz-win${{ matrix.ARCH }}.zip
        if-no-files-found: error

    - name: Save Compiler Cache
      if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
      uses: ./.github/actions/save-compiler-cache
      with:
        key: ${{ steps.compiler-cache.outputs.key }}
        variant: ${{ steps.compiler-cache.outputs.variant }}
        start: ${{ steps.compiler-cache.outputs.start }}

  release:
    name: Create and populate release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    if: contains(github.ref, 'refs/tags/')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Rename artifacts
        run: |
          for file in harfbuzz-win*.zip; do
            mv -v "$file" "${file%.zip}-${{ github.ref_name }}.zip"
          done
      - name: Check for release
        id: create_release
        run: |
          if ! gh release view ${{ github.ref_name }}; then
            gh release create ${{ github.ref_name }} --title ${{ github.ref_name }}
          fi
      - name: Populate release
        run: |
          gh release upload ${{ github.ref_name }} harfbuzz-win*-${{ github.ref_name }}.zip --clobber
